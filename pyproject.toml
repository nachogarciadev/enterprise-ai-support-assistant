[project]
name = "enterprise-ai-support-assistant"
version = "0.1.0"
description = "A modular FastAPI backend for an enterprise AI support assistant, built with a focus on reliability, testing, and extensibility."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
